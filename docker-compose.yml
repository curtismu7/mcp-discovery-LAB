# OrbStack:  HOST_PORT=5310 docker compose up --build -d   ->  http://127.0.0.1:5310/api/health
# The server binds 0.0.0.0 INSIDE the container (MCP_DISCOVERY_BIND is the opt-in), but the port is published on loopback only.
# Demo mode only: no host mounts, no docker socket, no host network. Do not change the 127.0.0.1 below.
name: mcp-discovery

services:
  mcp-discovery:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-5310}:5310"
    environment:
      SHELF_URL: ${SHELF_URL:-}
      MCP_DISCOVERY_PORT: "5310"
      MCP_DISCOVERY_BIND: 0.0.0.0
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5310/api/health').then(r=>r.json()).then(j=>process.exit(j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
